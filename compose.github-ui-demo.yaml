# Isolated local UI demo with mocked GitHub responses, never use on Coolify
services:
  frontend:
    image: dinnerbell-eason-frontend:local
    ports:
      - "127.0.0.1:8083:80"
  backend:
    image: dinnerbell-eason-backend:local
    command: ["sh", "-c", "alembic upgrade head && python -m tests.ai_ui_preview"]
    volumes:
      - ./backend/tests:/app/tests:ro
    environment:
      FRONTEND_ORIGIN: http://127.0.0.1:8083
      SEED_DEMO_DATA: "true"
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: ""
      ANALYSIS_LLM_API_KEY: ""
      REVIEW_LLM_API_KEY: ""
