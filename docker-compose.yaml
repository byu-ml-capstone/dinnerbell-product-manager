services:
  frontend:
    build: ./frontend
    expose:
      - "80"
    environment:
      - APP_URL=${SERVICE_FQDN_FRONTEND}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      start_period: 30s
      start_interval: 2s
      interval: 5m
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://appuser:apppass@db:5432/appdb
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Denver}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      - ANALYSIS_LLM_BASE_URL=${ANALYSIS_LLM_BASE_URL:-}
      - ANALYSIS_LLM_API_KEY=${ANALYSIS_LLM_API_KEY:-}
      - ANALYSIS_LLM_MODEL=${ANALYSIS_LLM_MODEL:-}
      - REVIEW_LLM_BASE_URL=${REVIEW_LLM_BASE_URL:-}
      - REVIEW_LLM_API_KEY=${REVIEW_LLM_API_KEY:-}
      - REVIEW_LLM_MODEL=${REVIEW_LLM_MODEL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      start_period: 30s
      start_interval: 2s
      interval: 5m
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=apppass
      - POSTGRES_DB=appdb
    expose:
      - "5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      start_period: 30s
      start_interval: 2s
      interval: 5m
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:

